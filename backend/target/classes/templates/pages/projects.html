<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Projects | My Portfolio</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #121212;
        color: #e5e7eb;
      }

      header {
        background-color: #1a1a1a !important;
      }

      .navbar-brand,
      .nav-link {
        color: #e5e7eb !important;
      }

      .nav-link:hover {
        color: #198754 !important;
      }

      .project-card {
        background: #1e1e1e;
        border-radius: 12px;
        overflow: hidden;
        height: 100%;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        margin-top: 12px;
        display: flex;
        flex-direction: column;
      }

      .project-cover {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: #181818;
      }

      .project-card-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }

      .project-title {
        font-size: 1.25rem;
        font-weight: 600;
      }

      .project-date {
        font-size: 0.9rem;
        color: #9ca3af;
      }

      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }

      .tag-pill {
        padding: 6px 12px;
        background: #198754;
        color: #fff;
        border-radius: 999px;
        font-size: 0.9rem;
        white-space: nowrap;
      }

      #mainContent {
        transform: translateY(-100vh);
        opacity: 0;
        transition:
          transform 0.8s ease-out,
          opacity 0.8s ease-out;
      }

      #mainContent.visible {
        transform: translateY(0);
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <header class="fixed-top shadow-sm">
      <nav class="navbar navbar-expand-lg container-fluid px-4">
        <a class="navbar-brand fw-bold" style="color: #198754" href="/">
          My Portfolio
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item mx-2"><a class="nav-link fw-semibold" href="/">Home</a></li>
            <li class="nav-item mx-2"><a class="nav-link fw-semibold" href="/about">About</a></li>
            <li class="nav-item mx-2"><a class="nav-link fw-semibold" href="/projects">Projects</a></li>
            <li class="nav-item mx-2"><a class="nav-link fw-semibold" href="/links">Links</a></li>
            <li class="nav-item mx-2"><a class="nav-link fw-semibold" href="/contact">Contact</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="container pt-5" style="margin-top: 15vh" id="mainContent">
      <h1 class="mb-4">Projects</h1>
      <div class="row g-4" id="projects-container"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      function formatProjectDates(project) {
        if (!project.startDate) {
          return "";
        }
        return `${project.startDate} - ${project.endDate ?? "Present"}`;
      }

      window.addEventListener("load", () => {
        const mainContent = document.getElementById("mainContent");
        setTimeout(() => mainContent.classList.add("visible"), 100);

        document.querySelectorAll(".nav-link").forEach((link) => {
          link.addEventListener("click", (e) => {
            e.preventDefault();
            const target = e.target.getAttribute("href");
            document.body.style.overflow = "hidden";
            mainContent.style.transform = "translateY(200vh)";
            mainContent.style.opacity = 0;
            setTimeout(() => (window.location.href = target), 500);
          });
        });

        const container = document.getElementById("projects-container");
        if (!container) return;

        fetch("/api/projects")
          .then((res) => (res.ok ? res.json() : Promise.reject(`HTTP ${res.status}`)))
          .then((projects) => {
            projects.forEach((project) => {
              const col = document.createElement("div");
              col.className = "col-lg-4 col-md-6";

              const tagsHTML =
                project.tags?.map((tag) => `<span class="tag-pill">${tag}</span>`).join("") || "";

              const imageHTML = project.coverImageUrl
                ? `<img class="project-cover" src="${project.coverImageUrl}" alt="${project.title}">`
                : "";

              col.innerHTML = `
                <div class="project-card">
                  ${imageHTML}
                  <div class="project-card-body">
                    <div class="project-title">${project.title}</div>
                    <div class="project-date">${formatProjectDates(project)}</div>
                    <p class="mt-2">${project.summary}</p>
                    <div class="tag-list">${tagsHTML}</div>
                    <div class="mt-auto pt-3 d-flex gap-2 flex-wrap">
                      <a href="/projects/${project.slug}" class="btn btn-success">View Project</a>
                      ${project.repositoryUrl ? `<a href="${project.repositoryUrl}" target="_blank" class="btn btn-outline-success">Repository</a>` : ""}
                      ${project.liveUrl ? `<a href="${project.liveUrl}" target="_blank" class="btn btn-outline-success">Live</a>` : ""}
                    </div>
                  </div>
                </div>
              `;
              container.appendChild(col);
            });
          })
          .catch((err) => console.error("Failed to load projects:", err));
      });
    </script>
  </body>
</html>
