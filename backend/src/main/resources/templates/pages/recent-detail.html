<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${post.title + ' | Recent'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/site.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar(${activePage})}"></div>

    <main class="page-shell page-shell-tight">
      <section class="section-block first-section">
        <div class="container">
          <article class="article-card article-card-wide article-card-reading">
            <p class="eyebrow">Recent</p>
            <h1 class="section-title section-title-xl" th:text="${post.title}"></h1>
            <p class="meta-row detail-meta" th:text="${#temporals.format(post.publishedAt, 'yyyy-MM-dd')}"></p>
            <p class="section-intro" th:text="${post.excerpt}"></p>
            <img class="detail-inline-image move_when_hovered" th:if="${post.coverImageUrl != null}" th:src="${post.coverImageUrl}" th:alt="${post.title}" />
            <textarea id="markdown-source" hidden th:text="${post.contentMarkdown}"></textarea>
            <div id="markdown-output" class="article-prose"></div>
          </article>
        </div>
      </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script th:src="@{/site.js}"></script>
    <script>
      window.renderMarkdownFromTextarea("markdown-source", "markdown-output");
    </script>
  </body>
</html>
