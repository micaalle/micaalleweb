<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recent | Michael Biskup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/site.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar(${activePage})}"></div>

    <main class="page-shell page-shell-tight">
      <section class="section-block first-section">
        <div class="container container-wide">
          <p class="eyebrow">Recent</p>
          <h1 class="section-title section-title-xl">Recent.</h1>

          <div class="archive-list archive-list-reading" th:if="${posts != null and !posts.isEmpty()}">
            <a class="archive-row archive-row-reading move_when_hovered" th:each="post : ${posts}" th:href="@{/recent/{slug}(slug=${post.slug})}">
              <span class="archive-date" th:text="${#temporals.format(post.publishedAt, 'yyyy-MM-dd')}"></span>
              <span class="archive-title" th:text="${post.title}"></span>
              <span class="archive-excerpt" th:text="${post.excerpt}"></span>
            </a>
          </div>
          <p class="empty-state-message" th:if="${posts == null or posts.isEmpty()}">No current entries.</p>
        </div>
      </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
