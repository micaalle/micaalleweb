<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo | Michael Biskup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/site.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar(${activePage})}"></div>

    <main class="page-shell page-shell-tight">
      <section class="section-block first-section">
        <div class="container photo-detail-page">
          <div class="photo-detail-image-shell photo-detail-image-shell-wide move_when_hovered">
            <img class="photo-detail-image photo-detail-image-large" th:src="${photo.imageUrl}" th:alt="${photo.title != null and !#strings.isEmpty(photo.title) ? photo.title : 'Photo'}" />
          </div>

          <div class="photo-detail-info">
            <p class="photo-meta-line" th:text="${photo.locationName != null and !#strings.isEmpty(photo.locationName) ? 'Taken ' + #temporals.format(photo.takenOn, 'yyyy-MM-dd') + ', at ' + photo.locationName : 'Taken ' + #temporals.format(photo.takenOn, 'yyyy-MM-dd')}"></p>
            <p class="photo-detail-caption" th:if="${photo.caption != null and !#strings.isEmpty(photo.caption)}" th:text="${photo.caption}"></p>
            <div class="link-row mt-4">
              <a class="btn btn-outline-light move_when_hovered" th:href="@{/photos}">Back to photos</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
