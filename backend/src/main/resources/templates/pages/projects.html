<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects | Michael Biskup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/site.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar(${activePage})}"></div>

    <main class="page-shell page-shell-tight">
      <section class="section-block first-section">
        <div class="container container-wide">
          <p class="eyebrow">Projects</p>
          <h1 class="section-title section-title-xl projects-page-title">Projects.</h1>

          <div class="card-grid project-grid-full">
            <article class="content-card content-card-reading move_when_hovered" th:each="project : ${projects}">
              <img class="content-card-image" th:if="${project.coverImageUrl != null}" th:src="${project.coverImageUrl}" th:alt="${project.title}" />
              <div class="content-card-body content-card-body-reading">
                <div class="badge-row">
                  <span class="badge-soft" th:if="${project.featured}">Featured</span>
                </div>
                <p class="meta-row" th:text="${#temporals.format(project.startDate, 'MMM yyyy') + (project.endDate != null ? ' – ' + #temporals.format(project.endDate, 'MMM yyyy') : ' – Present')}"></p>
                <h2 th:text="${project.title}"></h2>
                <p th:text="${project.summary}"></p>
                <div class="tag-row">
                  <span class="chip" th:each="tag : ${project.tags}" th:text="${tag}"></span>
                </div>
                <div class="link-row mt-auto">
                  <a class="inline-link" th:href="@{/projects/{slug}(slug=${project.slug})}">Open project page</a>
                  <a class="inline-link" th:if="${project.repositoryUrl != null}" th:href="${project.repositoryUrl}" target="_blank">Repository</a>
                </div>
              </div>
            </article>
          </div>
        </div>
      </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
