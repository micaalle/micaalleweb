<!--<!DOCTYPE html>



<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${project.title + ' | Project'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/site.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar(${activePage})}"></div>

    <main class="page-shell page-shell-tight">
      <section class="section-block first-section project-case-study-page">
        <div class="container container-case-study">
          <header class="project-hero-card">
            <div class="project-hero-top project-hero-top-integrated">
              <div class="project-hero-copy project-hero-copy-main">
                <div class="project-hero-intro-row">
                  <div class="project-hero-intro-copy">
                    <p class="eyebrow">Project case study</p>
                    <p class="meta-row detail-meta" th:text="${#temporals.format(project.startDate, 'MMMM yyyy') + (project.endDate != null ? ' – ' + #temporals.format(project.endDate, 'MMMM yyyy') : ' – Present')}"></p>
                    <h1 class="section-title section-title-xl" th:text="${project.title}"></h1>
                    <p class="project-hero-summary" th:text="${project.summary}"></p>
                  </div>

                  <figure class="project-hero-visual-inline" th:if="${project.coverImageUrl != null}">
                    <img class="project-hero-image" th:src="${project.coverImageUrl}" th:alt="${project.title}" />
                  </figure>
                </div>

                <div class="project-inline-meta">
                  <div class="project-meta-row" th:if="${project.status != null and !#strings.isEmpty(project.status)}">
                    <span class="project-meta-label">Status</span>
                    <span class="project-meta-value" th:text="${project.status}"></span>
                  </div>
                  <div class="project-meta-row" th:if="${project.role != null and !#strings.isEmpty(project.role)}">
                    <span class="project-meta-label">Role</span>
                    <span class="project-meta-value" th:text="${project.role}"></span>
                  </div>
                  <div class="project-meta-row" th:if="${project.tags != null and !#lists.isEmpty(project.tags)}">
                    <span class="project-meta-label">Tech</span>
                    <div class="tag-row tag-row-compact project-meta-tags">
                      <span class="chip" th:each="tag : ${project.tags}" th:text="${tag}"></span>
                    </div>
                  </div>
                </div>

                <div class="project-meta-actions project-meta-actions-inline">
                  <a class="btn btn-success move_when_hovered" th:if="${project.repositoryUrl != null}" th:href="${project.repositoryUrl}" target="_blank">Repository</a>
                  <a class="btn btn-outline-light move_when_hovered" th:if="${project.liveUrl != null}" th:href="${project.liveUrl}" target="_blank">Live link</a>
                </div>
              </div>

            </div>
          </header>

          <article class="project-story-card">
            <div class="case-study-intro-row">
              <div>
                <p class="eyebrow">Overview</p>
                <h2 class="case-study-title">Project Summary.</h2>
              </div>
            </div>

            <div class="case-study-section-grid" th:if="${project.projectSections != null and !#lists.isEmpty(project.projectSections)}">
              <section class="case-study-section" th:each="section : ${project.projectSections}">
                <div class="case-study-section-heading-row">
                  <p class="eyebrow" th:text="${section.heading}"></p>
                </div>
                <p class="case-study-copy" th:text="${section.body}"></p>

                <div class="case-study-media-stack" th:if="${section.mediaItems != null and !#lists.isEmpty(section.mediaItems)}">
                  <th:block th:each="media : ${section.mediaItems}">
                    <figure class="case-study-gallery-item" th:if="${#strings.equals(media.mediaType, 'image')}">
                      <img class="case-study-gallery-image" th:src="${media.url}" th:alt="${media.altText != null and !#strings.isEmpty(media.altText) ? media.altText : project.title}" />
                      <figcaption class="case-study-caption" th:if="${media.caption != null and !#strings.isEmpty(media.caption)}" th:text="${media.caption}"></figcaption>
                    </figure>

                    <div class="case-study-video-shell" th:if="${#strings.equals(media.mediaType, 'embed')}">
                      <iframe class="case-study-video" th:src="${media.url}" title="Project video" loading="lazy" allowfullscreen></iframe>
                    </div>

                    <figure class="case-study-gallery-item" th:if="${#strings.equals(media.mediaType, 'video')}">
                      <video class="case-study-gallery-video" controls playsinline preload="metadata">
                        <source th:src="${media.url}" />
                      </video>
                      <figcaption class="case-study-caption" th:if="${media.caption != null and !#strings.isEmpty(media.caption)}" th:text="${media.caption}"></figcaption>
                    </figure>
                  </th:block>
                </div>
              </section>
            </div>

            <div class="case-study-section-grid" th:if="${project.projectSections == null or #lists.isEmpty(project.projectSections)}">
              <section class="case-study-section" th:if="${project.whatItIs != null and !#strings.isEmpty(project.whatItIs)}">
                <p class="eyebrow">What it is</p>
                <p class="case-study-copy" th:text="${project.whatItIs}"></p>
              </section>
              <section class="case-study-section" th:if="${project.whyBuilt != null and !#strings.isEmpty(project.whyBuilt)}">
                <p class="eyebrow">Why I made it</p>
                <p class="case-study-copy" th:text="${project.whyBuilt}"></p>
              </section>
              <section class="case-study-section" th:if="${project.challengeSummary != null and !#strings.isEmpty(project.challengeSummary)}">
                <p class="eyebrow">What was hard</p>
                <p class="case-study-copy" th:text="${project.challengeSummary}"></p>
              </section>
              <section class="case-study-section" th:if="${project.solutionSummary != null and !#strings.isEmpty(project.solutionSummary)}">
                <p class="eyebrow">How I solved it</p>
                <p class="case-study-copy" th:text="${project.solutionSummary}"></p>
              </section>
              <section class="case-study-section" th:if="${project.nextSteps != null and !#strings.isEmpty(project.nextSteps)}">
                <p class="eyebrow">What I’d improve next</p>
                <p class="case-study-copy" th:text="${project.nextSteps}"></p>
              </section>
            </div>

            <section class="case-study-section case-study-section-notes" th:if="${project.contentMarkdown != null and !#strings.isEmpty(project.contentMarkdown)}">
              <p class="eyebrow">Additional notes</p>
              <textarea id="markdown-source" hidden th:text="${project.contentMarkdown}"></textarea>
              <div id="markdown-output" class="article-prose article-prose-project"></div>
            </section>
          </article>
        </div>
      </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script th:src="@{/site.js}"></script>
    <script>
      window.renderMarkdownFromTextarea("markdown-source", "markdown-output");
    </script>
  </body>
</html>
