<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${project.title} + ' | Portfolio'">Project</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #121212;
        color: #e5e7eb;
      }
      header {
        background-color: #1a1a1a !important;
      }
      .navbar-brand,
      .nav-link {
        color: #e5e7eb !important;
      }
      .nav-link:hover {
        color: #198754 !important;
      }
      .panel {
        background: #1e1e1e;
        border-radius: 16px;
        padding: 24px;
      }
      .hero-image,
      .section-image,
      .section-video {
        width: 100%;
        border-radius: 12px;
        background: #181818;
      }
      .section-image {
        margin-top: 12px;
      }
      .section-video {
        margin-top: 12px;
      }
      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .tag-pill {
        padding: 6px 12px;
        background: #198754;
        color: #fff;
        border-radius: 999px;
        font-size: 0.9rem;
      }
      .section-block + .section-block {
        margin-top: 24px;
      }
      .meta {
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <header class="fixed-top shadow-sm">
      <nav class="navbar navbar-expand-lg container-fluid px-4">
        <a class="navbar-brand fw-bold" style="color: #198754" href="/">My Portfolio</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item mx-2"><a class="nav-link fw-semibold" href="/">Home</a></li>
            <li class="nav-item mx-2"><a class="nav-link fw-semibold" href="/about">About</a></li>
            <li class="nav-item mx-2"><a class="nav-link fw-semibold" href="/projects">Projects</a></li>
            <li class="nav-item mx-2"><a class="nav-link fw-semibold" href="/links">Links</a></li>
            <li class="nav-item mx-2"><a class="nav-link fw-semibold" href="/contact">Contact</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="container pt-5 pb-5" style="margin-top: 12vh; max-width: 980px">
      <div class="panel mb-4">
        <div class="row g-4 align-items-start">
          <div class="col-lg-7">
            <h1 class="mb-2" th:text="${project.title}">Project</h1>
            <div class="meta mb-3">
              <span th:text="${project.startDate}">2025-01-01</span>
              <span th:if="${project.endDate != null}"> - <span th:text="${project.endDate}">2025-12-31</span></span>
              <span th:if="${project.endDate == null}"> - Present</span>
              <span th:if="${project.status != null and !#strings.isEmpty(project.status)}"> · <span th:text="${project.status}">Status</span></span>
              <span th:if="${project.role != null and !#strings.isEmpty(project.role)}"> · <span th:text="${project.role}">Role</span></span>
            </div>
            <p class="mb-3" th:text="${project.summary}">Summary</p>
            <div class="tag-list mb-4" th:if="${project.tags != null and !project.tags.isEmpty()}">
              <span class="tag-pill" th:each="tag : ${project.tags}" th:text="${tag}">Tag</span>
            </div>
            <div class="d-flex gap-2 flex-wrap">
              <a th:if="${project.repositoryUrl != null and !#strings.isEmpty(project.repositoryUrl)}" th:href="${project.repositoryUrl}" target="_blank" class="btn btn-success">Repository</a>
              <a th:if="${project.liveUrl != null and !#strings.isEmpty(project.liveUrl)}" th:href="${project.liveUrl}" target="_blank" class="btn btn-outline-success">Live</a>
            </div>
          </div>
          <div class="col-lg-5" th:if="${project.coverImageUrl != null and !#strings.isEmpty(project.coverImageUrl)}">
            <img class="hero-image" th:src="${project.coverImageUrl}" th:alt="${project.title}" />
          </div>
        </div>
      </div>

      <div class="panel" th:if="${project.projectSections != null and !project.projectSections.isEmpty()}">
        <div class="section-block" th:each="section : ${project.projectSections}">
          <h3 class="mb-3" th:text="${section.heading}">Heading</h3>
          <p class="mb-0" th:if="${section.body != null and !#strings.isEmpty(section.body)}" th:text="${section.body}">Body</p>
          <div th:if="${section.mediaItems != null and !section.mediaItems.isEmpty()}" class="mt-3 d-grid gap-3">
            <div th:each="media : ${section.mediaItems}">
              <img th:if="${media.mediaType == 'image'}" class="section-image" th:src="${media.url}" th:alt="${media.altText}" />
              <video th:if="${media.mediaType == 'video'}" class="section-video" controls playsinline>
                <source th:src="${media.url}" type="video/mp4" />
              </video>
              <iframe th:if="${media.mediaType == 'embed'}" class="section-video" th:src="${media.url}" allowfullscreen></iframe>
              <p class="mt-2 text-secondary" th:if="${media.caption != null and !#strings.isEmpty(media.caption)}" th:text="${media.caption}">Caption</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
