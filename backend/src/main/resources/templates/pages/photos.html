<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photos | Michael Biskup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/site.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar(${activePage})}"></div>

    <main class="page-shell page-shell-tight">
      <section class="section-block first-section">
        <div class="container">
          <p class="eyebrow">Photos</p>
          <h1 class="section-title section-title-xl">Photos.</h1>

          <div class="photo-grid photo-grid-clean">
            <th:block th:each="entry : ${photosByYear}">
              <article class="photo-tile photo-tile-year move_when_hovered">
                <div>
                  <span class="photo-year" th:text="${entry.key}"></span>
                </div>
              </article>
              <a class="photo-tile photo-tile-clean move_when_hovered" th:each="photo : ${entry.value}" th:href="@{/photos/{id}(id=${photo.id})}">
                <img class="photo-image" th:src="${photo.imageUrl}" th:alt="${photo.title != null and !#strings.isEmpty(photo.title) ? photo.title : 'Photo'}" />
              </a>
            </th:block>
          </div>
        </div>
      </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
