<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photos | Michael Biskup</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/site.css}" />

    <style>
      .photo-section {
        margin-bottom: 40px;
      }

      .photo-year {
        font-size: 14px;
        letter-spacing: 0.1em;
        opacity: 0.6;
        margin-bottom: 10px;
      }

      .photo-grid-clean {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 6px; 
      }

      .photo-tile {
        display: block;
        overflow: hidden;
      }

      .photo-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.35s ease;
      }

      .photo-tile:hover .photo-image {
        transform: scale(1.02);
      }
    </style>
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar(${activePage})}"></div>

    <main class="page-shell page-shell-tight">
      <section class="section-block first-section">
        <div class="container">

          <p class="eyebrow">Photos</p>
          <h1 class="section-title section-title-xl">Photos.</h1>

          <th:block th:each="entry : ${photosByYear}">

            <div class="photo-section">

              <div class="photo-year">
                <span th:text="${entry.key}"></span>
              </div>

              <div class="photo-grid photo-grid-clean">

                <a class="photo-tile"
                   th:each="photo : ${entry.value}"
                   th:href="@{/photos/{id}(id=${photo.id})}">

                  <img class="photo-image"
                       th:src="${photo.imageUrl}"
                       alt="Photo" />

                </a>

              </div>

            </div>

          </th:block>

        </div>
      </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
